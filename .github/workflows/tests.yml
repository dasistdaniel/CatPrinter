name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    # Das Projekt ist Windows-spezifisch (COM-Port, Tray, Installer) – also auch dort testen
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Tests (ohne Drucker)
        run: python -m unittest discover tests -v

  build:
    name: exe bauen
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pyinstaller

      - name: build.ps1
        shell: pwsh
        run: ./build.ps1

      - name: exe als Artefakt ablegen
        uses: actions/upload-artifact@v7
        with:
          name: CatPrinter-exe
          path: dist/CatPrinter.exe
          retention-days: 14
